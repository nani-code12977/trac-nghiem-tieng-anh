<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Thi & Kiểm Tra Ngữ Pháp Tiếng Anh</title>
  <style>
    :root {
      --bg-main: #f4f7fb;
      --bg-card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --success-border: #34d399;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-border: #f87171;
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 80px;
    }

    /* Header & Sticky Bar */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .mode-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .mode-tab {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* Sub-toolbar */
    .toolbar {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
    }

    .toolbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.9rem;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: var(--bg-card);
      border-color: var(--border);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-success:hover {
      background: #059669;
    }

    .status-pills {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.85rem;
      background: #e2e8f0;
      color: var(--text-main);
    }

    .pill.green {
      background: var(--success-bg);
      color: #065f46;
      border: 1px solid var(--success-border);
    }

    .pill.red {
      background: var(--danger-bg);
      color: #991b1b;
      border: 1px solid var(--danger-border);
    }

    .pill.blue {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #bfdbfe;
    }

    /* Main Container */
    .container {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Question Cards */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .question-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease;
    }

    .question-card.card-correct {
      border-color: var(--success-border);
    }

    .question-card.card-wrong {
      border-color: var(--danger-border);
    }

    .q-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .q-number {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .q-badge {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .q-badge.correct {
      background: var(--success-bg);
      color: #047857;
    }

    .q-badge.wrong {
      background: var(--danger-bg);
      color: #b91c1c;
    }

    .q-badge.unanswered {
      background: var(--warning-bg);
      color: #b45309;
    }

    .q-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.96rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #93c5fd;
      background: #f8fafc;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f1f5f9;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    /* Exam mode selected */
    .option-btn.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
    }

    .option-btn.selected .opt-letter {
      background: var(--primary);
      color: #ffffff;
    }

    /* Correct & Wrong highlighting */
    .option-btn.is-correct {
      border-color: var(--success) !important;
      background: var(--success-bg) !important;
      color: #065f46 !important;
      font-weight: 600;
    }

    .option-btn.is-correct .opt-letter {
      background: var(--success) !important;
      color: #ffffff !important;
    }

    .option-btn.is-wrong {
      border-color: var(--danger) !important;
      background: var(--danger-bg) !important;
      color: #991b1b !important;
      font-weight: 600;
    }

    .option-btn.is-wrong .opt-letter {
      background: var(--danger) !important;
      color: #ffffff !important;
    }

    /* Exam Submit Footer */
    .exam-footer {
      margin-top: 28px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow);
    }

    .btn-submit-lg {
      padding: 12px 28px;
      font-size: 1rem;
    }

    /* Results / Statistics Dashboard */
    .stats-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--primary-light);
      border: 6px solid var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .score-num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }

    .score-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin: 22px 0;
    }

    .stat-card {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    .stat-card .val {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .stat-card .lbl {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      .header-inner {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .brand {
        justify-content: center;
      }
      .mode-tabs {
        justify-content: center;
      }
      .question-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <span>📘 Hệ Thống Luyện Thi Ngữ Pháp Tiếng Anh</span>
      </div>
      <div class="mode-tabs">
        <button id="tabPractice" class="mode-tab active" onclick="switchMode('practice')">Chế độ Ôn tập</button>
        <button id="tabExam" class="mode-tab" onclick="switchMode('exam')">Chế độ Làm đề</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="toolbar-inner">
        <div class="controls-group">
          <label for="questionCountSelect"><strong>Số câu hỏi:</strong></label>
          <select id="questionCountSelect" onchange="initSession()">
            <option value="20">20 câu ngẫu nhiên</option>
            <option value="40" selected>40 câu ngẫu nhiên</option>
            <option value="60">60 câu ngẫu nhiên</option>
            <option value="100">100 câu ngẫu nhiên</option>
            <option value="200">200 câu ngẫu nhiên</option>
            <option value="400">Toàn bộ ngân hàng (400 câu)</option>
          </select>
          <button class="btn btn-outline" onclick="initSession()">🔄 Đổi bộ câu hỏi mới</button>
        </div>

        <!-- Status in Practice Mode -->
        <div id="practiceStats" class="status-pills">
          <span class="pill blue" id="pracProgress">Đã làm: 0/40</span>
          <span class="pill green" id="pracCorrect">Đúng: 0</span>
          <span class="pill red" id="pracWrong">Sai: 0</span>
        </div>

        <!-- Status in Exam Mode -->
        <div id="examStats" class="status-pills hidden">
          <span class="pill blue" id="examProgress">Đã chọn: 0/40</span>
          <span class="pill" id="examTimer">⏱ 00:00</span>
          <button id="topSubmitBtn" class="btn btn-success" onclick="submitExam()">Nộp bài</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Statistics View (Only visible after submitting Exam) -->
    <section id="statsSection" class="hidden">
      <div class="stats-box">
        <div class="score-circle">
          <div class="score-num" id="finalScore10">0.0</div>
          <div class="score-label">THANG ĐIỂM 10</div>
        </div>
        <h2 id="resultHeadline" style="margin-bottom: 6px;">Kết quả bài làm</h2>
        <p id="resultSubtext" style="color: var(--text-muted); font-size: 0.95rem;"></p>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div class="lbl">Tổng số câu</div>
          </div>
          <div class="stat-card" style="border-color: var(--success-border); background: var(--success-bg);">
            <div class="val" style="color: #047857;" id="statCorrect">0</div>
            <div class="lbl" style="color: #065f46;">Câu làm đúng</div>
          </div>
          <div class="stat-card" style="border-color: var(--danger-border); background: var(--danger-bg);">
            <div class="val" style="color: #b91c1c;" id="statWrong">0</div>
            <div class="lbl" style="color: #991b1b;">Câu làm sai</div>
          </div>
          <div class="stat-card" style="border-color: #fde68a; background: var(--warning-bg);">
            <div class="val" style="color: #b45309;" id="statUnanswered">0</div>
            <div class="lbl" style="color: #92400e;">Chưa chọn</div>
          </div>
        </div>

        <button class="btn btn-primary btn-submit-lg" onclick="initSession()">📝 Làm lại đề mới</button>
      </div>

      <div class="filter-bar">
        <h3>Chi tiết bài làm</h3>
        <div class="filter-tabs">
          <button class="filter-btn active" onclick="filterReview('all', this)">Tất cả</button>
          <button class="filter-btn" onclick="filterReview('wrong', this)">Câu sai & Chưa làm</button>
          <button class="filter-btn" onclick="filterReview('correct', this)">Câu làm đúng</button>
        </div>
      </div>
    </section>

    <!-- Questions List -->
    <section id="questionsContainer" class="question-list"></section>

    <!-- Bottom Submit Bar for Exam Mode -->
    <div id="examFooter" class="exam-footer hidden">
      <div>
        <strong>Hoàn thành bài thi?</strong>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Kiểm tra kỹ các đáp án trước khi bấm Nộp bài để xem điểm và đáp án chi tiết.</p>
      </div>
      <button class="btn btn-success btn-submit-lg" onclick="submitExam()">✅ Nộp bài & Chấm điểm</button>
    </div>
  </main>

  <script>
    /*

     * Cấu trúc mỗi phần tử: [Câu hỏi, Đáp án ĐÚNG, Phương án nhiễu 1, Phương án nhiễu 2, Phương án nhiễu 3]

    // App State
    let currentMode = 'practice'; // 'practice' | 'exam'
    let sessionQuestions = [];
    let userAnswers = {}; // { questionIndex: chosenOptionIndex }
    let isExamSubmitted = false;
    let timerInterval = null;
    let secondsElapsed = 0;
    let currentFilter = 'all';

    // Utility: Fisher-Yates Shuffle
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Switch between Practice and Exam modes
    function switchMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;

      document.getElementById('tabPractice').classList.toggle('active', mode === 'practice');
      document.getElementById('tabExam').classList.toggle('active', mode === 'exam');

      document.getElementById('practiceStats').classList.toggle('hidden', mode !== 'practice');
      document.getElementById('examStats').classList.toggle('hidden', mode !== 'exam');

      initSession();
    }

    // Initialize or Reset a Session
    function initSession() {
      stopTimer();
      isExamSubmitted = false;
      userAnswers = {};
      currentFilter = 'all';

      const countSelect = document.getElementById('questionCountSelect');
      const requestedCount = parseInt(countSelect.value, 10) || 40;
      const actualCount = Math.min(requestedCount, RAW_QUESTIONS.length);

      // Pick random questions and shuffle their 4 options
      const pickedRaw = shuffleArray(RAW_QUESTIONS).slice(0, actualCount);
      sessionQuestions = pickedRaw.map((item, idx) => {
        const qText = item[0];
        const correctStr = item[1];
        const allOptions = shuffleArray([item[1], item[2], item[3], item[4]]);
        const correctIndex = allOptions.indexOf(correctStr);
        return {
          id: idx,
          text: qText,
          options: allOptions,
          correctIndex: correctIndex
        };
      });

      // Reset UI visibility
      document.getElementById('statsSection').classList.add('hidden');
      document.getElementById('topSubmitBtn').classList.remove('hidden');
      document.getElementById('examFooter').classList.toggle('hidden', currentMode !== 'exam');

      renderQuestions();
      updateStatusCounters();

      if (currentMode === 'exam') {
        startTimer();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Timer for Exam Mode
    function startTimer() {
      secondsElapsed = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateTimerDisplay() {
      document.getElementById('examTimer').textContent = `⏱ ${formatTime(secondsElapsed)}`;
    }

    // Render Question Cards
    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      sessionQuestions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${qIdx}`;

        const header = document.createElement('div');
        header.className = 'q-header';
        header.innerHTML = `
          <span class="q-number">Câu ${qIdx + 1}</span>
          <span id="q-badge-${qIdx}" class="q-badge hidden"></span>
        `;

        const textEl = document.createElement('div');
        textEl.className = 'q-text';
        textEl.textContent = q.text;

        const grid = document.createElement('div');
        grid.className = 'options-grid';

        q.options.forEach((optText, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.id = `opt-${qIdx}-${optIdx}`;
          btn.onclick = () => handleOptionClick(qIdx, optIdx);

          const letterSpan = document.createElement('span');
          letterSpan.className = 'opt-letter';
          letterSpan.textContent = letters[optIdx];

          const contentSpan = document.createElement('span');
          contentSpan.textContent = optText;

          btn.appendChild(letterSpan);
          btn.appendChild(contentSpan);
          grid.appendChild(btn);
        });

        card.appendChild(header);
        card.appendChild(textEl);
        card.appendChild(grid);
        container.appendChild(card);
      });
    }

    // Handle clicking an option
    function handleOptionClick(qIdx, optIdx) {
      if (currentMode === 'practice') {
        // In Practice mode: once answered, lock and show immediate feedback
        if (userAnswers[qIdx] !== undefined) return;
        userAnswers[qIdx] = optIdx;

        const q = sessionQuestions[qIdx];
        const isCorrect = (optIdx === q.correctIndex);
        const card = document.getElementById(`q-card-${qIdx}`);
        const badge = document.getElementById(`q-badge-${qIdx}`);

        card.classList.add(isCorrect ? 'card-correct' : 'card-wrong');
        badge.classList.remove('hidden');
        if (isCorrect) {
          badge.className = 'q-badge correct';
          badge.textContent = '✓ Chính xác';
        } else {
          badge.className = 'q-badge wrong';
          badge.textContent = '✗ Sai rồi';
        }

        // Highlight options & disable buttons for this question
        for (let i = 0; i < 4; i++) {
          const btn = document.getElementById(`opt-${qIdx}-${i}`);
          btn.disabled = true;
          if (i === q.correctIndex) {
            btn.classList.add('is-correct');
          } else if (i === optIdx && !isCorrect) {
            btn.classList.add('is-wrong');
          }
        }

        updateStatusCounters();
      } else if (currentMode === 'exam') {
        // In Exam mode: allow changing choice freely before submitting, NO right/wrong hint
        if (isExamSubmitted) return;
        userAnswers[qIdx] = optIdx;

        for (let i = 0; i < 4; i++) {
          const btn = document.getElementById(`opt-${qIdx}-${i}`);
          btn.classList.toggle('selected', i === optIdx);
        }

        updateStatusCounters();
      }
    }

    // Update top counters
    function updateStatusCounters() {
      const total = sessionQuestions.length;
      const answeredKeys = Object.keys(userAnswers);
      const answeredCount = answeredKeys.length;

      if (currentMode === 'practice') {
        let correct = 0;
        let wrong = 0;
        answeredKeys.forEach(k => {
          const qIdx = parseInt(k, 10);
          if (userAnswers[qIdx] === sessionQuestions[qIdx].correctIndex) {
            correct++;
          } else {
            wrong++;
          }
        });
        document.getElementById('pracProgress').textContent = `Đã làm: ${answeredCount}/${total}`;
        document.getElementById('pracCorrect').textContent = `Đúng: ${correct}`;
        document.getElementById('pracWrong').textContent = `Sai: ${wrong}`;
      } else {
        document.getElementById('examProgress').textContent = `Đã chọn: ${answeredCount}/${total}`;
      }
    }

    // Submit Exam & Show Statistics
    function submitExam() {
      if (isExamSubmitted) return;

      const total = sessionQuestions.length;
      const answeredCount = Object.keys(userAnswers).length;
      const unansweredCount = total - answeredCount;

      if (unansweredCount > 0) {
        const confirmSubmit = confirm(`Bạn còn ${unansweredCount} câu chưa chọn đáp án. Bạn có chắc chắn muốn nộp bài ngay không?`);
        if (!confirmSubmit) return;
      }

      stopTimer();
      isExamSubmitted = true;

      let correctCount = 0;
      let wrongCount = 0;

      // Grade and highlight every question
      sessionQuestions.forEach((q, qIdx) => {
        const chosen = userAnswers[qIdx];
        const card = document.getElementById(`q-card-${qIdx}`);
        const badge = document.getElementById(`q-badge-${qIdx}`);
        badge.classList.remove('hidden');

        const isCorrect = (chosen === q.correctIndex);
        if (chosen === undefined) {
          card.classList.add('card-wrong');
          badge.className = 'q-badge unanswered';
          badge.textContent = '! Chưa chọn đáp án';
        } else if (isCorrect) {
          correctCount++;
          card.classList.add('card-correct');
          badge.className = 'q-badge correct';
          badge.textContent = '✓ Làm đúng';
        } else {
          wrongCount++;
          card.classList.add('card-wrong');
          badge.className = 'q-badge wrong';
          badge.textContent = '✗ Làm sai';
        }

        for (let i = 0; i < 4; i++) {
          const btn = document.getElementById(`opt-${qIdx}-${i}`);
          btn.disabled = true;
          btn.classList.remove('selected');
          if (i === q.correctIndex) {
            btn.classList.add('is-correct');
          } else if (chosen === i && !isCorrect) {
            btn.classList.add('is-wrong');
          }
        }
      });

      // Populate Statistics Box
      const score10 = ((correctCount / total) * 10).toFixed(2);
      const percent = Math.round((correctCount / total) * 100);

      document.getElementById('finalScore10').textContent = score10;
      document.getElementById('resultHeadline').textContent = `Bạn đạt ${correctCount}/${total} câu đúng (${percent}%)`;
      document.getElementById('resultSubtext').textContent = `Thời gian hoàn thành: ${formatTime(secondsElapsed)} • Xem lại chi tiết các câu đúng và sai bên dưới.`;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statCorrect').textContent = correctCount;
      document.getElementById('statWrong').textContent = wrongCount;
      document.getElementById('statUnanswered').textContent = unansweredCount;

      document.getElementById('statsSection').classList.remove('hidden');
      document.getElementById('examFooter').classList.add('hidden');
      document.getElementById('topSubmitBtn').classList.add('hidden');

      // Reset review filter buttons
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach((b, idx) => b.classList.toggle('active', idx === 0));

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Filter questions in post-exam review
    function filterReview(type, btnEl) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      sessionQuestions.forEach((q, qIdx) => {
        const card = document.getElementById(`q-card-${qIdx}`);
        const chosen = userAnswers[qIdx];
        const isCorrect = (chosen === q.correctIndex);

        if (type === 'all') {
          card.classList.remove('hidden');
        } else if (type === 'correct') {
          card.classList.toggle('hidden', !isCorrect);
        } else if (type === 'wrong') {
          card.classList.toggle('hidden', isCorrect);
        }
      });
    }

    // Start initial session on load
    window.addEventListener('DOMContentLoaded', initSession);
  </script>
